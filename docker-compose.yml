services:
  postgres:
    image: postgres:16-alpine
    container_name: healthsuite-postgres
    restart: unless-stopped
    command: ["postgres", "-p", "42900"]   # listen on the project port inside the container too
    environment:
      POSTGRES_DB: healthsuite
      POSTGRES_USER: ${DATABASE_USERNAME}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
    ports:
      - "42900:42900"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -p 42900 -U ${DATABASE_USERNAME} -d healthsuite"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
#      context: ./backend
      dockerfile: Dockerfile
    image: healthsuite_backend   # Docker image names must be lowercase
    container_name: healthsuite-backend
    restart: unless-stopped
    ports:
      - "20580:20580"
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:42900/healthsuite
      DATABASE_USERNAME: ${DATABASE_USERNAME}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
    driver: local
