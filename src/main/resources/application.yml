spring:
  application:
    name: health-suite-backend

  # Java 21 Virtual Threads — all HTTP handlers run on virtual threads
  threads:
    virtual:
      enabled: true

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5450/healthsuite}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      pool-name: HealthSuiteHikariPool

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
        jdbc:
          batch_size: 50
          order_inserts: true
          order_updates: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB

server:
  port: 8080
  error:
    include-stacktrace: never
    include-message: never

# Application-level configuration
app:
  jwt:
    secret: ${JWT_SECRET:fallback-dev-secret-replace-in-production-min-32chars}
    access-token-expiration-ms: 900000     # 15 minutes
    refresh-token-expiration-ms: 604800000 # 7 days

  # File storage — 'local' uses ~/HealthSuite/uploads, switch to 's3' when ready
  storage:
    provider: local
    local:
      path: ${user.home}/HealthSuite/uploads
    consult:
      path: ${user.home}/HealthSuite/user_consult

  # ── Add when ready ────────────────────────────────────────────────────────
  # aws:
  #   s3:
  #     bucket-name: ${S3_BUCKET_NAME:healthsuite-documents}
  #     region: ${AWS_REGION:ap-southeast-1}
  #     access-key: ${AWS_ACCESS_KEY:}
  #     secret-key: ${AWS_SECRET_KEY:}

  # firebase:
  #   service-account-path: ${FIREBASE_SERVICE_ACCOUNT_PATH:}

  # social:
  #   google:
  #     client-id: ${GOOGLE_CLIENT_ID:}
  #   facebook:
  #     app-id: ${FACEBOOK_APP_ID:}
  #     app-secret: ${FACEBOOK_APP_SECRET:}
  # ─────────────────────────────────────────────────────────────────────────

  scraper:
    target-urls:
      - ${DOCTOR_SCRAPER_URL_1:}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true
    filter: true
    try-it-out-enabled: true
  api-docs:
    path: /v3/api-docs
  packages-to-scan: com.healthsuite
  show-actuator: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    com.healthsuite: INFO
    org.springframework.security: WARN
    org.flywaydb: INFO
