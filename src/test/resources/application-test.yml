spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false  # Use ddl-auto for tests

app:
  jwt:
    secret: test-secret-key-minimum-32-chars-for-hmac-sha256
    access-token-expiration-ms: 900000
    refresh-token-expiration-ms: 604800000
  aws:
    s3:
      bucket-name: test-bucket
      region: us-east-1
      access-key: test
      secret-key: test
  firebase:
    service-account-path: classpath:firebase-service-account-test.json
  social:
    google:
      client-id: test-google-client-id
    facebook:
      app-id: test-fb-app-id
      app-secret: test-fb-secret
  scraper:
    target-urls: []
