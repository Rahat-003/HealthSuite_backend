# Test profile. The datasource comes from the Testcontainers PostgreSQL started in
# support/PostgresContainerConfig (@ServiceConnection), so Flyway runs the real
# migrations and Hibernate validates the entities against them — same as prod.
spring:
  jpa:
    show-sql: false

app:
  jwt:
    secret: test-secret-key-minimum-32-chars-for-hmac-sha256
    access-token-expiration-ms: 900000
    refresh-token-expiration-ms: 604800000
  storage:
    local:
      path: ${java.io.tmpdir}/healthsuite-test/uploads
    consult:
      path: ${java.io.tmpdir}/healthsuite-test/user_consult
  scraper:
    target-urls: []

logging:
  level:
    com.healthsuite: INFO
    org.springframework.security: WARN
